<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Muhammad Hadi</title>
  <link rel="stylesheet" href="style3.css">
  <link rel="stylesheet" href="site-enhancements.css">
  <style>
    body {
      background: radial-gradient(ellipse at center, #2e003b 0%, #120019 60%, #08000d 100%);
      color: #fff1ff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .error-card {
      background: rgba(30, 8, 40, 0.85);
      border: 1px solid rgba(220, 100, 255, 0.35);
      border-radius: 20px;
      padding: clamp(30px, 6vw, 50px) clamp(20px, 5vw, 40px);
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(180, 0, 220, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .error-code {
      font-size: clamp(64px, 12vw, 100px);
      font-weight: 900;
      line-height: 1;
      margin: 0 0 10px;
      background: linear-gradient(135deg, #ffd166 0%, #ff4da6 50%, #db4cfc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
    }
    .error-title {
      font-size: clamp(22px, 4vw, 28px);
      margin: 0 0 14px;
      color: #ffffff;
      font-family: Georgia, serif;
    }
    .error-message {
      font-size: 15px;
      color: #dfc2e6;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #88009b 0%, #bd02bd 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(180, 0, 220, 0.45);
      transition: all 0.3s ease;
    }
    .not-found-btn:hover {
      background: linear-gradient(135deg, #a000b5 0%, #db02db 100%);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(220, 50, 255, 0.6);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-message">The requested page or social profile could not be found or is currently unavailable.</p>
    <a href="home.html" class="not-found-btn">← Return to Home</a>
  </div>
</body>
</html>
